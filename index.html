<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ENGINE SYNTH</title>
<style>
  @font-face {
    font-family: 'DashMono';
    src: local('JetBrains Mono'), local('Courier New');
  }
  :root {
    --bg: #0a0c0e;
    --panel: #14181c;
    --line: #2a3138;
    --text: #e8ecef;
    --dim: #6b7680;
    --amber: #ffb020;
    --amber-dim: #7a5518;
    --red: #ff3b30;
    --green: #3ddc84;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DashMono', 'JetBrains Mono', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }
  .eyebrow {
    letter-spacing: 0.35em;
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .gauge-wrap {
    position: relative;
    width: min(72vw, 340px);
    height: min(72vw, 340px);
  }
  svg { width: 100%; height: 100%; display: block; }
  .tick { stroke: var(--line); stroke-width: 2; }
  .tick.hot { stroke: var(--red); }
  .needle {
    stroke: var(--amber);
    stroke-width: 3;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(255,176,32,0.6));
  }
  .hub { fill: var(--panel); stroke: var(--line); stroke-width: 2; }
  .readout {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, 10%);
    text-align: center;
  }
  .kmh { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .kmh-unit { font-size: 11px; color: var(--dim); letter-spacing: 0.2em; margin-top: 4px; }
  .gear {
    position: absolute;
    top: 22%; left: 50%;
    transform: translate(-50%, 0);
    font-size: 13px;
    color: var(--amber);
    letter-spacing: 0.15em;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.1em;
    min-height: 16px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
  button#toggle {
    appearance: none;
    border: 1px solid var(--amber-dim);
    background: linear-gradient(180deg, #1b1409, #100c05);
    color: var(--amber);
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.25em;
    padding: 18px 46px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
  }
  button#toggle:active { transform: translateY(1px); }
  button#toggle.on {
    color: #0a0c0e;
    background: var(--amber);
    border-color: var(--amber);
    box-shadow: 0 0 24px rgba(255,176,32,0.45);
  }
  .note {
    max-width: 320px;
    text-align: center;
    font-size: 11px;
    color: var(--dim);
    line-height: 1.6;
    letter-spacing: 0.02em;
  }
  .dot.test { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .test-panel {
    width: min(72vw, 340px);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    background: var(--panel);
    display: none;
  }
  .test-panel.open { display: block; }
  .test-panel-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .test-panel input[type="range"] {
    width: 100%;
    accent-color: var(--amber);
  }
  .test-presets {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .test-presets button {
    flex: 1;
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .test-presets button:active { background: var(--amber-dim); }
  .test-presets button.on {
    border-color: var(--amber-dim);
    color: var(--amber);
    background: rgba(255,176,32,0.08);
  }
  .sound-panel {
    width: min(72vw, 340px);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    background: var(--panel);
  }
  #testModeBtn {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.15em;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
  }
  #testModeBtn.on {
    color: var(--amber);
    border-color: var(--amber-dim);
  }
</style>
</head>
<body>

  <div class="eyebrow">FAKE EXHAUST · GPS SYNC</div>

  <div class="gauge-wrap">
    <svg viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="128" fill="none" stroke="var(--line)" stroke-width="2"/>
      <g id="ticks"></g>
      <line id="needle" class="needle" x1="150" y1="150" x2="150" y2="46"/>
      <circle class="hub" cx="150" cy="150" r="10"/>
    </svg>
    <div class="gear" id="gearLabel">N</div>
    <div class="readout">
      <div class="kmh" id="kmh">0</div>
      <div class="kmh-unit">KM/H</div>
    </div>
  </div>

  <div class="status-row">
    <div class="dot" id="gpsDot"></div>
    <span id="statusText">GPS INAKTIV</span>
    <button id="testModeBtn">Testtilstand</button>
  </div>

  <div class="test-panel" id="testPanel">
    <div class="test-panel-row">
      <span>SIMULERET HASTIGHED</span>
      <span id="testSpeedLabel">0 KM/H</span>
    </div>
    <input type="range" id="testSlider" min="0" max="220" value="0" step="1">
    <div class="test-presets">
      <button data-v="0">Stop</button>
      <button data-v="50">50</button>
      <button data-v="80">80</button>
      <button data-v="130">130</button>
    </div>
  </div>

  <div class="sound-panel">
    <div class="test-panel-row">
      <span>MOTORLYD</span>
    </div>
    <div class="test-presets" id="profileButtons">
      <button data-profile="standard" class="on">Standard</button>
      <button data-profile="rs3">RS3 5-cyl</button>
      <button data-profile="r8">R8 V10</button>
    </div>
  </div>

  <button id="toggle">Start motor</button>

  <div class="note">Syntetisk motorlyd genereret i browseren — ingen lydfiler. Volumen og tonehøjde følger din GPS-hastighed og acceleration. Betjen kun skærmen mens du holder stille.</div>

<script>
(function() {
  const toggleBtn = document.getElementById('toggle');
  const kmhEl = document.getElementById('kmh');
  const gearEl = document.getElementById('gearLabel');
  const needle = document.getElementById('needle');
  const gpsDot = document.getElementById('gpsDot');
  const statusText = document.getElementById('statusText');
  const ticksGroup = document.getElementById('ticks');

  // ---- draw gauge ticks (0..260 degree sweep, 0-8 "RPM x1000" style) ----
  const cx = 150, cy = 150, rOuter = 128, rInner = 112;
  const startAngle = -220, endAngle = 40; // degrees, gauge sweep
  const totalTicks = 20;
  for (let i = 0; i <= totalTicks; i++) {
    const t = i / totalTicks;
    const angle = (startAngle + t * (endAngle - startAngle)) * Math.PI / 180;
    const x1 = cx + rInner * Math.cos(angle);
    const y1 = cy + rInner * Math.sin(angle);
    const x2 = cx + rOuter * Math.cos(angle);
    const y2 = cy + rOuter * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'tick' + (t > 0.82 ? ' hot' : ''));
    ticksGroup.appendChild(line);
  }
  // needle rotation: map 0..1 (rpm fraction) to startAngle..endAngle, needle default points to -90 (up), so offset by +90
  function setNeedle(frac) {
    const angle = startAngle + frac * (endAngle - startAngle) + 90;
    needle.setAttribute('transform', `rotate(${angle} 150 150)`);
  }
  setNeedle(0.06);

  // ---- gear thresholds (km/h) — 6 gears, tuned so the common Danish speed
  // limits (50 / 80 / 130) land partway up the rev range of their gear
  // instead of right at the bottom just after a shift ----
  const gearStarts = [0, 14, 28, 42, 64, 95];
  const topCap = 175; // upper bound used for gear 6's range
  function gearInfo(speed) {
    let g = 1;
    for (let i = 1; i < gearStarts.length; i++) {
      if (speed >= gearStarts[i]) g = i + 1; else break;
    }
    g = Math.min(g, gearStarts.length);
    const lo = gearStarts[g - 1];
    const hi = g < gearStarts.length ? gearStarts[g] : topCap;
    const fracRaw = Math.max(0, Math.min(1, (speed - lo) / (hi - lo)));

    // Compress the rpm range per gear so upshifts don't fall all the way to
    // idle and downshifts don't fly all the way to redline. Gear 1 gets the
    // full range since it covers launch from a standstill.
    let frac;
    if (g === 1) {
      frac = 0.05 + fracRaw * 0.9;
    } else {
      frac = 0.35 + fracRaw * 0.57;
    }
    return { gear: g, frac };
  }

  // ---- sound profiles ----
  // Each profile is a stylised synthesis recipe, not a sample of the real
  // car. RS3 gets a warble layer (two summed LFOs on the tone's gain) to
  // approximate the off-beat "5-cylinder gurgle"; R8 leans on more oscillator
  // layers and almost no warble for a smoother, higher-revving scream.
  const PROFILES = {
    standard: {
      label: 'Standard',
      idleHz: 42, redlineHz: 210,
      waveforms: ['sawtooth', 'sawtooth', 'square', 'sawtooth'],
      detune: [1, 1.006, 0.5, 1.010],
      subMix: 0.9, harmonicMix: 0.0,
      warbleDepth: 0, warbleRateMul: 0,
      filterBase: 300, filterSpan: 2600, filterThrottle: 900,
      noiseMax: 0.35,
    },
    rs3: {
      label: 'Audi RS3 (5-cyl)',
      idleHz: 55, redlineHz: 260,
      waveforms: ['sawtooth', 'sawtooth', 'square', 'sawtooth'],
      detune: [1, 1.004, 0.5, 1.011],
      subMix: 0.8, harmonicMix: 0.3,
      warbleDepth: 0.32, warbleRateMul: 0.62,
      filterBase: 260, filterSpan: 3400, filterThrottle: 1100,
      noiseMax: 0.3,
    },
    r8: {
      label: 'Audi R8 (V10)',
      idleHz: 48, redlineHz: 340,
      waveforms: ['sawtooth', 'sawtooth', 'sawtooth', 'sawtooth'],
      detune: [1, 1.003, 0.5, 1.008],
      subMix: 0.55, harmonicMix: 0.5,
      warbleDepth: 0.06, warbleRateMul: 0.3,
      filterBase: 420, filterSpan: 4200, filterThrottle: 1400,
      noiseMax: 0.25,
    },
  };
  let currentProfileKey = 'standard';
  let currentProfile = PROFILES.standard;

  // ---- audio engine ----
  let audioCtx = null;
  let master, saw1, saw2, sub, saw3, filter, noiseSrc, noiseFilter, noiseGain, lfo, lfoGain;
  let subGain, harmonicGain, tremoloGain, warbleLfo1, warbleLfo2, warbleDepthGain1, warbleDepthGain2;
  let running = false;

  function buildAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    master = audioCtx.createGain();
    master.gain.value = 0;
    master.connect(audioCtx.destination);

    // main tone layers
    saw1 = audioCtx.createOscillator();
    saw1.type = 'sawtooth';
    saw1.frequency.value = 60;

    saw2 = audioCtx.createOscillator();
    saw2.type = 'sawtooth';
    saw2.frequency.value = 60.4;

    // sub oscillator for low rumble
    sub = audioCtx.createOscillator();
    sub.type = 'square';
    sub.frequency.value = 30;
    subGain = audioCtx.createGain();
    subGain.gain.value = currentProfile.subMix;

    // extra harmonic layer, mixed in per profile for extra richness (V10)
    saw3 = audioCtx.createOscillator();
    saw3.type = 'sawtooth';
    saw3.frequency.value = 60.8;
    harmonicGain = audioCtx.createGain();
    harmonicGain.gain.value = currentProfile.harmonicMix;

    filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    filter.Q.value = 1.2;

    // tremolo/warble stage: amplitude-modulates the tone to approximate an
    // uneven firing rhythm. Depth is 0 for profiles that don't need it.
    tremoloGain = audioCtx.createGain();
    tremoloGain.gain.value = 1;

    const toneGain = audioCtx.createGain();
    toneGain.gain.value = 0.9;

    saw1.connect(filter);
    saw2.connect(filter);
    sub.connect(subGain);
    subGain.connect(filter);
    saw3.connect(harmonicGain);
    harmonicGain.connect(filter);
    filter.connect(tremoloGain);
    tremoloGain.connect(toneGain);
    toneGain.connect(master);

    warbleLfo1 = audioCtx.createOscillator();
    warbleLfo1.type = 'sine';
    warbleLfo1.frequency.value = 8;
    warbleDepthGain1 = audioCtx.createGain();
    warbleDepthGain1.gain.value = 0;
    warbleLfo1.connect(warbleDepthGain1);
    warbleDepthGain1.connect(tremoloGain.gain);

    warbleLfo2 = audioCtx.createOscillator();
    warbleLfo2.type = 'sine';
    warbleLfo2.frequency.value = 20;
    warbleDepthGain2 = audioCtx.createGain();
    warbleDepthGain2.gain.value = 0;
    warbleLfo2.connect(warbleDepthGain2);
    warbleDepthGain2.connect(tremoloGain.gain);

    // idle wobble LFO on filter cutoff
    lfo = audioCtx.createOscillator();
    lfo.frequency.value = 7;
    lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 15;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);

    // road/wind noise bed
    const bufSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    noiseSrc.loop = true;

    noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 800;
    noiseFilter.Q.value = 0.6;

    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0;

    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(master);

    [saw1, saw2, sub, saw3, lfo, warbleLfo1, warbleLfo2, noiseSrc].forEach(n => n.start());
    master.gain.setTargetAtTime(0.55, audioCtx.currentTime, 0.4);

    applyProfile(currentProfileKey);
  }

  function stopAudio() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    master.gain.setTargetAtTime(0, now, 0.15);
    setTimeout(() => {
      [saw1, saw2, sub, saw3, lfo, warbleLfo1, warbleLfo2, noiseSrc].forEach(n => { try { n.stop(); } catch (e) {} });
      audioCtx.close();
      audioCtx = null;
    }, 400);
  }

  // switch the active car sound. Safe to call whether or not audio is running.
  function applyProfile(key) {
    currentProfileKey = key;
    currentProfile = PROFILES[key];
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const p = currentProfile;
    saw1.type = p.waveforms[0];
    saw2.type = p.waveforms[1];
    sub.type = p.waveforms[2];
    saw3.type = p.waveforms[3];
    subGain.gain.setTargetAtTime(p.subMix, now, 0.25);
    harmonicGain.gain.setTargetAtTime(p.harmonicMix, now, 0.25);
    warbleDepthGain1.gain.setTargetAtTime(p.warbleDepth * 0.7, now, 0.25);
    warbleDepthGain2.gain.setTargetAtTime(p.warbleDepth * 0.3, now, 0.25);
  }

  // map engine "rpm fraction" (0..1 within current gear) + throttle punch to audio params
  function applyEngineState(rpmFrac, throttle, speedKmh) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const p = currentProfile;
    const baseFreq = p.idleHz + rpmFrac * (p.redlineHz - p.idleHz);
    const punch = throttle * 18;
    const d = p.detune;

    saw1.frequency.setTargetAtTime((baseFreq + punch) * d[0], now, 0.05);
    saw2.frequency.setTargetAtTime((baseFreq + punch) * d[1], now, 0.05);
    sub.frequency.setTargetAtTime((baseFreq + punch) * d[2], now, 0.05);
    saw3.frequency.setTargetAtTime((baseFreq + punch) * d[3], now, 0.05);

    const cutoff = p.filterBase + rpmFrac * p.filterSpan + throttle * p.filterThrottle;
    filter.frequency.setTargetAtTime(cutoff, now, 0.08);

    const noiseLevel = Math.min(p.noiseMax, (speedKmh / 220) * p.noiseMax);
    noiseGain.gain.setTargetAtTime(noiseLevel, now, 0.3);
    noiseFilter.frequency.setTargetAtTime(500 + speedKmh * 12, now, 0.3);

    lfoGain.gain.setTargetAtTime(speedKmh < 5 ? 15 : 4, now, 0.3);

    // warble/firing rhythm rate rises with rpm, like a real firing frequency
    warbleLfo1.frequency.setTargetAtTime(4 + rpmFrac * baseFreq * p.warbleRateMul, now, 0.1);
    warbleLfo2.frequency.setTargetAtTime(10 + rpmFrac * baseFreq * p.warbleRateMul * 2.3, now, 0.1);
  }

  // ---- GPS tracking ----
  let watchId = null;
  let lastPos = null, lastTime = null;
  let smoothedSpeed = 0; // km/h
  let smoothedAccel = 0; // km/h per second, clamped display value
  let testMode = false;
  let testInterval = null;
  let lastTestTime = null;

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // shared by GPS and test mode: feed one raw speed sample + how long since
  // the last sample, update the smoothed speed/acceleration used for audio
  function feedSpeedSample(rawSpeedKmh, dtSec) {
    if (rawSpeedKmh === null || !isFinite(rawSpeedKmh)) return;
    dtSec = Math.max(0.15, dtSec || 1);
    const accel = (rawSpeedKmh - smoothedSpeed) / dtSec;
    smoothedAccel = smoothedAccel * 0.5 + accel * 0.5;
    smoothedSpeed = smoothedSpeed * 0.5 + rawSpeedKmh * 0.5;
  }

  function onPosition(pos) {
    if (testMode) return; // ignore real GPS while simulating

    gpsDot.classList.add('live');
    gpsDot.classList.remove('err', 'test');
    statusText.textContent = 'GPS AKTIV';

    const now = pos.timestamp;
    let rawSpeedKmh = null;

    if (typeof pos.coords.speed === 'number' && pos.coords.speed >= 0) {
      rawSpeedKmh = pos.coords.speed * 3.6;
    } else if (lastPos && lastTime) {
      const dt = (now - lastTime) / 1000;
      if (dt > 0.2) {
        const dist = haversine(lastPos.latitude, lastPos.longitude, pos.coords.latitude, pos.coords.longitude);
        rawSpeedKmh = (dist / dt) * 3.6;
      }
    }

    const dtSec = lastTime ? (now - lastTime) / 1000 : 1;
    feedSpeedSample(rawSpeedKmh, dtSec);

    lastPos = pos.coords;
    lastTime = now;
  }

  function onGpsError(err) {
    if (testMode) return;
    gpsDot.classList.remove('live');
    gpsDot.classList.add('err');
    statusText.textContent = 'GPS FEJL: ' + (err.message || 'ukendt');
  }

  function startGps() {
    if (!('geolocation' in navigator)) {
      if (!testMode) {
        statusText.textContent = 'GPS IKKE TILGÆNGELIG';
        gpsDot.classList.add('err');
      }
      return;
    }
    watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 8000
    });
  }
  function stopGps() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    lastPos = null; lastTime = null;
    if (!testMode) {
      gpsDot.classList.remove('live', 'err');
      statusText.textContent = 'GPS INAKTIV';
    }
  }

  // ---- render / animation loop ----
  let rafId = null;

  function tick() {
    const speed = Math.max(0, smoothedSpeed);
    const throttle = Math.max(0, Math.min(1, smoothedAccel / 6));

    const { gear, frac } = gearInfo(speed);
    const rpmFrac = Math.max(0.05, frac);

    kmhEl.textContent = Math.round(speed);
    gearEl.textContent = speed < 2 ? 'N' : String(gear);
    setNeedle(rpmFrac);

    if (running) applyEngineState(rpmFrac, throttle, speed);

    rafId = requestAnimationFrame(tick);
  }
  tick();

  // ---- sound profile buttons ----
  document.querySelectorAll('#profileButtons button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#profileButtons button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      applyProfile(btn.dataset.profile);
    });
  });

  // ---- test mode (simulate speed without GPS, e.g. at your desk) ----
  const testModeBtn = document.getElementById('testModeBtn');
  const testPanel = document.getElementById('testPanel');
  const testSlider = document.getElementById('testSlider');
  const testSpeedLabel = document.getElementById('testSpeedLabel');

  testSlider.addEventListener('input', () => {
    testSpeedLabel.textContent = testSlider.value + ' KM/H';
  });

  document.querySelectorAll('.test-presets button').forEach(btn => {
    btn.addEventListener('click', () => {
      testSlider.value = btn.dataset.v;
      testSpeedLabel.textContent = btn.dataset.v + ' KM/H';
    });
  });

  testModeBtn.addEventListener('click', () => {
    testMode = !testMode;
    testModeBtn.classList.toggle('on', testMode);
    testPanel.classList.toggle('open', testMode);

    if (testMode) {
      gpsDot.classList.remove('live', 'err');
      gpsDot.classList.add('test');
      statusText.textContent = 'TEST-TILSTAND';
      lastTestTime = Date.now();
      testInterval = setInterval(() => {
        const now = Date.now();
        const dtSec = (now - lastTestTime) / 1000;
        feedSpeedSample(Number(testSlider.value), dtSec);
        lastTestTime = now;
      }, 150);
    } else {
      clearInterval(testInterval);
      testInterval = null;
      gpsDot.classList.remove('test');
      if (watchId !== null) {
        gpsDot.classList.add('live');
        statusText.textContent = 'GPS AKTIV';
      } else {
        statusText.textContent = 'GPS INAKTIV';
      }
    }
  });

  // ---- toggle button ----
  toggleBtn.addEventListener('click', () => {
    if (!running) {
      running = true;
      toggleBtn.textContent = 'Stop motor';
      toggleBtn.classList.add('on');
      buildAudio();
      startGps();
    } else {
      running = false;
      toggleBtn.textContent = 'Start motor';
      toggleBtn.classList.remove('on');
      stopAudio();
      stopGps();
      smoothedSpeed = 0;
      smoothedAccel = 0;
    }
  });
})();
</script>
</body>
</html>
